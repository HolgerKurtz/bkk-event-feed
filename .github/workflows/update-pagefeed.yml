name: Update page feed

on:
  schedule:
    - cron: "17 3 * * *"   # daily, ~04:17/05:17 Berlin
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fails the run on any problem -> GitHub emails you; the old CSV stays live.
      - run: python3 pagefeed.py pagefeed.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add pagefeed.csv
          git diff --cached --quiet || git commit -m "Update page feed $(date -u +%F)"
          git push

name: Update page feed

on:
  schedule:
    # GitHub often starts scheduled runs hours late (observed ~5h), so run
    # right after midnight Berlin (CEST / CET) and once more as a fallback.
    - cron: "7 22 * * *"   # 00:07 Berlin in summer time
    - cron: "7 23 * * *"   # 00:07 Berlin in winter time
    - cron: "7 3 * * *"    # fallback
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fails the run on any problem -> GitHub emails you; the old CSV stays live.
      - run: python3 pagefeed.py pagefeed.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add pagefeed.csv
          git diff --cached --quiet || git commit -m "Update page feed $(date -u +%F)"
          git push

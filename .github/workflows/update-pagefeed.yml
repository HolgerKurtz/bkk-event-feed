name: Update page feeds

on:
  schedule:
    # GitHub often starts scheduled runs hours late (observed ~5h), so run
    # right after midnight Berlin (CEST / CET) and once more as a fallback.
    - cron: "7 22 * * *"   # 00:07 Berlin in summer time
    - cron: "7 23 * * *"   # 00:07 Berlin in winter time
    - cron: "7 3 * * *"    # fallback
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs every client in clients/. If one fails, its old CSV stays live, the
      # others are still updated, and the run is marked failed -> GitHub emails you.
      - run: python3 pagefeed.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git diff --cached --quiet || git commit -m "Update page feeds $(date -u +%F)"
          git push
